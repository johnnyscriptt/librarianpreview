plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // Creates a client-only source set (src/client) so client code never loads on a server.
    splitEnvironmentSourceSets()

    mods {
        "librarianpreview" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// In-game tests (src/gametest): store screenshots and the icon render, driven through the
// mod's real keys and screens. Run with: gradlew runClientGameTest
// The gametest source set is not part of the shipped jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "librarianpreview-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    // Loom adds the Minecraft/Fabric mavens automatically.
}

dependencies {
    // Minecraft 26.x ships unobfuscated: no mappings dependency and no remap step.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE")
}

// The walk-past video takes a few minutes of frames: gradlew runClientGameTest -Pvideo=true
tasks.matching { it.name == "runClientGameTest" }.configureEach {
    systemProperty "librarianpreview.video", project.findProperty("video") ?: "false"
}
